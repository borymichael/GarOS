/* =========================================================================
   FACTURATION ÉLECTRONIQUE — Factur-X (PDF + XML CII embarqué)
   -------------------------------------------------------------------------
   IMPORTANT : ceci génère le FORMAT de fichier attendu par la réforme
   (Factur-X, profil BASIC). Cela ne remplace PAS une Plateforme Agréée
   (PA, ex-PDP) : la loi exige que la transmission passe par une PA
   accréditée par l'État. GarageOS ne peut pas obtenir ce statut. Ce
   fichier est fait pour être déposé/transmis ensuite via la PA de votre
   choix. Vérifiez le fichier généré avec votre PA ou votre comptable
   avant de vous y fier pour la conformité légale — cette génération n'a
   pas été validée par un outil de contrôle officiel.
   ========================================================================= */
function escXml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function ymdCompact(d){ return (d||'').replace(/-/g,''); }
function buildFacturXXml(f){
  const s = db.settings; const c = getClient(f.clientId); const t = docTotals(f);
  const tvaGroups = {};
  (f.lignes||[]).forEach(l=>{ const r = Number(l.tva)||0; const ht = (Number(l.qte)||0)*(Number(l.pu)||0); tvaGroups[r] = (tvaGroups[r]||0) + ht; });
  const ratio = t.ht>0 ? t.htApresRemise/t.ht : 1;
  const lignesXml = (f.lignes||[]).map((l,i)=>{
    const ht = (Number(l.qte)||0)*(Number(l.pu)||0);
    return `
    <ram:IncludedSupplyChainTradeLineItem>
      <ram:AssociatedDocumentLineDocument><ram:LineID>${i+1}</ram:LineID></ram:AssociatedDocumentLineDocument>
      <ram:SpecifiedTradeProduct><ram:Name>${escXml(l.designation)}</ram:Name></ram:SpecifiedTradeProduct>
      <ram:SpecifiedLineTradeAgreement><ram:NetPriceProductTradePrice><ram:ChargeAmount>${(Number(l.pu)||0).toFixed(2)}</ram:ChargeAmount></ram:NetPriceProductTradePrice></ram:SpecifiedLineTradeAgreement>
      <ram:SpecifiedLineTradeDelivery><ram:BilledQuantity unitCode="C62">${Number(l.qte)||0}</ram:BilledQuantity></ram:SpecifiedLineTradeDelivery>
      <ram:SpecifiedLineTradeSettlement>
        <ram:ApplicableTradeTax><ram:TypeCode>VAT</ram:TypeCode><ram:CategoryCode>S</ram:CategoryCode><ram:RateApplicablePercent>${(Number(l.tva)||0).toFixed(2)}</ram:RateApplicablePercent></ram:ApplicableTradeTax>
        <ram:SpecifiedTradeSettlementLineMonetarySummation><ram:LineTotalAmount>${ht.toFixed(2)}</ram:LineTotalAmount></ram:SpecifiedTradeSettlementLineMonetarySummation>
      </ram:SpecifiedLineTradeSettlement>
    </ram:IncludedSupplyChainTradeLineItem>`;
  }).join('');
  const taxXml = Object.keys(tvaGroups).map(rate=>{
    const base = tvaGroups[rate]*ratio;
    const amount = base*(Number(rate)/100);
    return `
      <ram:ApplicableTradeTax>
        <ram:CalculatedAmount>${amount.toFixed(2)}</ram:CalculatedAmount>
        <ram:TypeCode>VAT</ram:TypeCode>
        <ram:BasisAmount>${base.toFixed(2)}</ram:BasisAmount>
        <ram:CategoryCode>S</ram:CategoryCode>
        <ram:RateApplicablePercent>${Number(rate).toFixed(2)}</ram:RateApplicablePercent>
      </ram:ApplicableTradeTax>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8"?>
<rsm:CrossIndustryInvoice xmlns:rsm="urn:un:unece:uncefact:data:standard:CrossIndustryInvoice:100" xmlns:ram="urn:un:unece:uncefact:data:standard:ReusableAggregateBusinessInformationEntity:100" xmlns:udt="urn:un:unece:uncefact:data:standard:UnqualifiedDataType:100">
  <rsm:ExchangedDocumentContext>
    <ram:GuidelineSpecifiedDocumentContextParameter><ram:ID>urn:factur-x.eu:1p0:basic</ram:ID></ram:GuidelineSpecifiedDocumentContextParameter>
  </rsm:ExchangedDocumentContext>
  <rsm:ExchangedDocument>
    <ram:ID>${escXml(f.numero)}</ram:ID>
    <ram:TypeCode>380</ram:TypeCode>
    <ram:IssueDateTime><udt:DateTimeString format="102">${ymdCompact(f.date)}</udt:DateTimeString></ram:IssueDateTime>
  </rsm:ExchangedDocument>
  <rsm:SupplyChainTradeTransaction>${lignesXml}
    <ram:ApplicableHeaderTradeAgreement>
      <ram:SellerTradeParty>
        <ram:Name>${escXml(s.nomGarage)}</ram:Name>
        <ram:SpecifiedLegalOrganization><ram:ID schemeID="0002">${escXml(s.siret)}</ram:ID></ram:SpecifiedLegalOrganization>
        <ram:PostalTradeAddress><ram:PostcodeCode>${escXml(s.cp)}</ram:PostcodeCode><ram:LineOne>${escXml(s.adresse)}</ram:LineOne><ram:CityName>${escXml(s.ville)}</ram:CityName><ram:CountryID>FR</ram:CountryID></ram:PostalTradeAddress>
        <ram:SpecifiedTaxRegistration><ram:ID schemeID="VA">${escXml(s.tvaIntracom)}</ram:ID></ram:SpecifiedTaxRegistration>
      </ram:SellerTradeParty>
      <ram:BuyerTradeParty>
        <ram:Name>${escXml(clientLabel(c))}</ram:Name>
        <ram:PostalTradeAddress><ram:PostcodeCode>${escXml(c?.cp||'')}</ram:PostcodeCode><ram:LineOne>${escXml(c?.adresse||'')}</ram:LineOne><ram:CityName>${escXml(c?.ville||'')}</ram:CityName><ram:CountryID>FR</ram:CountryID></ram:PostalTradeAddress>
      </ram:BuyerTradeParty>
    </ram:ApplicableHeaderTradeAgreement>
    <ram:ApplicableHeaderTradeDelivery/>
    <ram:ApplicableHeaderTradeSettlement>
      <ram:InvoiceCurrencyCode>EUR</ram:InvoiceCurrencyCode>${taxXml}
      <ram:SpecifiedTradePaymentTerms><ram:DueDateDateTime><udt:DateTimeString format="102">${ymdCompact(f.dateEcheance||f.date)}</udt:DateTimeString></ram:DueDateDateTime></ram:SpecifiedTradePaymentTerms>
      <ram:SpecifiedTradeSettlementHeaderMonetarySummation>
        <ram:LineTotalAmount>${t.htApresRemise.toFixed(2)}</ram:LineTotalAmount>
        <ram:TaxBasisTotalAmount>${t.htApresRemise.toFixed(2)}</ram:TaxBasisTotalAmount>
        <ram:TaxTotalAmount currencyID="EUR">${t.tva.toFixed(2)}</ram:TaxTotalAmount>
        <ram:GrandTotalAmount>${t.ttc.toFixed(2)}</ram:GrandTotalAmount>
        <ram:TotalPrepaidAmount>${(f.montantPaye||0).toFixed(2)}</ram:TotalPrepaidAmount>
        <ram:DuePayableAmount>${Math.max(t.ttc-(f.montantPaye||0),0).toFixed(2)}</ram:DuePayableAmount>
      </ram:SpecifiedTradeSettlementHeaderMonetarySummation>
    </ram:ApplicableHeaderTradeSettlement>
  </rsm:SupplyChainTradeTransaction>
</rsm:CrossIndustryInvoice>`;
}
async function generateFacturX(factureId){
  const f = db.factures.find(x=>x.id===factureId); if(!f) return;
  if(typeof PDFLib === 'undefined'){ toast("La librairie PDF n'a pas pu se charger (vérifie ta connexion) — réessaie."); return; }
  toast('Génération de la facture électronique…');
  try{
    const s = db.settings; const c = getClient(f.clientId); const v = getVehicule(f.vehiculeId); const t = docTotals(f);
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const pdfDoc = await PDFDocument.create();
    pdfDoc.setTitle(`Facture ${f.numero}`); pdfDoc.setProducer('GarageOS'); pdfDoc.setCreator('GarageOS');
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const bold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
    let page = pdfDoc.addPage([595, 842]); // A4
    let y = 800;
    const left = 40;
    function line(text, x, size, useFont, color){ page.drawText(text||'', {x, y, size: size||10, font: useFont||font, color: color||rgb(0.08,0.09,0.1)}); }
    function newPageIfNeeded(margin){ if(y < (margin||80)){ page = pdfDoc.addPage([595,842]); y = 800; } }

    line(s.nomGarage||'', left, 16, bold); y-=18;
    line(`${s.adresse||''} ${s.cp||''} ${s.ville||''}`.trim(), left, 9); y-=12;
    if(s.siret) { line(`SIRET ${s.siret}`, left, 9); y-=12; }
    if(s.tvaIntracom) { line(`TVA ${s.tvaIntracom}`, left, 9); y-=12; }
    y = 800; line('FACTURE', 420, 16, bold); y-=18;
    line(f.numero, 420, 12, bold); y-=14;
    line(`Date : ${fdate(f.date)}`, 420, 9); y-=12;
    line(`Échéance : ${fdate(f.dateEcheance)}`, 420, 9);
    y = 730;
    line('Client', left, 10, bold); y-=13;
    line(clientLabel(c), left, 10); y-=13;
    line(`${c?.adresse||''} ${c?.cp||''} ${c?.ville||''}`.trim(), left, 9); y-=13;
    if(v){ line(`Véhicule : ${vehiculeLabel(v)}`, left, 9); y-=13; }
    y -= 14;
    line('Désignation', left, 9, bold);
    line('Qté', 330, 9, bold);
    line('PU HT', 380, 9, bold);
    line('TVA', 450, 9, bold);
    line('Total HT', 490, 9, bold);
    y -= 6; page.drawLine({start:{x:left,y}, end:{x:555,y}, thickness:0.5, color: rgb(0.7,0.7,0.7)}); y -= 14;
    (f.lignes||[]).forEach(l=>{
      newPageIfNeeded(120);
      const totalL = (Number(l.qte)||0)*(Number(l.pu)||0);
      line(String(l.designation||'').slice(0,48), left, 9);
      line(String(l.qte), 330, 9);
      line(money(l.pu), 380, 9);
      line((l.tva||0)+'%', 450, 9);
      line(money(totalL), 490, 9);
      y -= 15;
    });
    y -= 10; page.drawLine({start:{x:left,y}, end:{x:555,y}, thickness:0.5, color: rgb(0.7,0.7,0.7)}); y -= 18;
    newPageIfNeeded(140);
    line('Sous-total HT', 400, 10); line(money(t.ht), 500, 10); y-=15;
    if(t.remiseVal>0){ line('Remise', 400, 10); line('-'+money(t.remiseVal), 500, 10); y-=15; }
    line('TVA', 400, 10); line(money(t.tva), 500, 10); y-=15;
    line('Total TTC', 400, 12, bold); line(money(t.ttc), 500, 12, bold); y-=16;
    line('Réglé', 400, 10); line(money(f.montantPaye||0), 500, 10); y-=15;
    line('Restant dû', 400, 10, bold); line(money(Math.max(t.ttc-(f.montantPaye||0),0)), 500, 10, bold); y-=25;
    newPageIfNeeded(60);
    page.drawText("Facture électronique (Factur-X, profil BASIC) — fichier XML structuré joint à ce PDF.", {x:left, y, size:7.5, font, color: rgb(0.4,0.4,0.4)});

    const xml = buildFacturXXml(f);
    const xmlBytes = new TextEncoder().encode(xml);
    await pdfDoc.attach(xmlBytes, 'factur-x.xml', {
      mimeType: 'application/xml',
      description: 'Factur-X invoice data (CII, BASIC profile)',
      creationDate: new Date(), modificationDate: new Date(),
      afRelationship: 'Data'
    });

    const bytes = await pdfDoc.save();
    const filename = `${f.numero}-facturx.pdf`;
    const dl = await getDownloads();
    if(dl){ try{ await dl.save({filename, data: bytes}); toast('Facture électronique générée.'); return; }catch(e){} }
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('Facture électronique générée.');
  }catch(e){
    console.error(e);
    toast('Erreur lors de la génération de la facture électronique.');
  }
}

/* =========================================================================
   RAPPORTS DE RENTABILITE
   ========================================================================= */
function viewRapports(root){
  const payees = db.factures.filter(f=>f.statut==='payee');
  const months = [];
  const now = new Date();
  for(let i=11;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({ym: toYearMonthStr(d), label: d.toLocaleDateString('fr-FR',{month:'short'})}); }
  const caParMois = months.map(m=>({...m, value: payees.filter(f=>f.date.startsWith(m.ym)).reduce((s,f)=>s+docTotals(f).htApresRemise,0)}));

  let htPiece=0, htMo=0, htForfait=0, margePieces=0, htPiecesTotal=0;
  const parPieceQty = {}; const parClientCA = {};
  payees.forEach(f=>{
    const ratio = (()=>{ const t=docTotals(f); return t.ht>0? t.htApresRemise/t.ht : 1; })();
    (f.lignes||[]).forEach(l=>{
      const lht = (Number(l.qte)||0)*(Number(l.pu)||0)*ratio;
      if(l.type==='piece'){ htPiece+=lht; htPiecesTotal+=lht;
        if(l.pieceId){ const p = db.pieces.find(x=>x.id===l.pieceId); if(p){ margePieces += (Number(l.pu)-Number(p.prixAchat))*(Number(l.qte)||0); parPieceQty[l.pieceId] = (parPieceQty[l.pieceId]||0) + (Number(l.qte)||0); } }
      } else if(l.type==='mo'){ htMo+=lht; } else { htForfait+=lht; }
    });
    parClientCA[f.clientId] = (parClientCA[f.clientId]||0) + docTotals(f).ttc;
  });
  const totalCA = htPiece+htMo+htForfait;
  const topClients = Object.entries(parClientCA).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topPieces = Object.entries(parPieceQty).sort((a,b)=>b[1]-a[1]).slice(0,5);

  root.innerHTML = `
    <div class="toolbar"><div style="flex:1"></div><button class="btn btn-sm" onclick="sendMonthlyReportNow()">${icoMail()} Envoyer le CA du mois vers Make</button></div>
    <div class="card" style="margin-bottom:14px;">
      <h3 style="margin-bottom:12px;">Chiffre d'affaires HT — 12 derniers mois</h3>
      <div class="bar-chart">${svgBarChart(caParMois)}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr; margin-bottom:14px;">
      <div class="card">
        <h3 style="margin-bottom:12px;">Répartition du chiffre d'affaires (HT, factures payées)</h3>
        <div style="display:flex; flex-direction:column; gap:9px;">
          ${repartitionRow('Pièces', htPiece, totalCA, 'var(--accent)')}
          ${repartitionRow("Main d'œuvre", htMo, totalCA, 'var(--steel)')}
          ${htForfait>0?repartitionRow('Informations / divers', htForfait, totalCA, 'var(--warning)'):''}
        </div>
      </div>
      <div class="card">
        <h3 style="margin-bottom:12px;">Marge estimée sur les pièces</h3>
        <div class="stat" style="border:none; padding:0;"><div class="value" style="color:var(--success)">${money(margePieces)}</div><div class="hint">sur ${money(htPiecesTotal)} de CA pièces (${htPiecesTotal>0?Math.round(margePieces/htPiecesTotal*100):0}% de marge)</div></div>
        <p style="font-size:11.5px; color:var(--ink-faint); margin-top:10px;">Estimation basée sur le prix d'achat actuel des pièces au catalogue.</p>
      </div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="card">
        <h3 style="margin-bottom:10px;">Meilleurs clients (CA TTC)</h3>
        ${topClients.length===0?`<div class="empty" style="padding:14px;">Pas encore de données.</div>`:
          `<div class="table-wrap"><table><thead><tr><th>Client</th><th class="num">CA</th></tr></thead><tbody>${topClients.map(([cid,ca])=>`<tr onclick="go('clientDetail',{id:'${cid}'})"><td>${esc(clientLabel(getClient(cid)))}</td><td class="num">${money(ca)}</td></tr>`).join('')}</tbody></table></div>`}
      </div>
      <div class="card">
        <h3 style="margin-bottom:10px;">Pièces les plus vendues</h3>
        ${topPieces.length===0?`<div class="empty" style="padding:14px;">Pas encore de données.</div>`:
          `<div class="table-wrap"><table><thead><tr><th>Pièce</th><th class="num">Qté vendue</th></tr></thead><tbody>${topPieces.map(([pid,qty])=>{const p=db.pieces.find(x=>x.id===pid); return `<tr><td>${esc(p?p.designation:'(pièce supprimée)')}</td><td class="num">${qty}</td></tr>`;}).join('')}</tbody></table></div>`}
      </div>
    </div>
  `;
}
function repartitionRow(label, value, total, color){
  const pct = total>0 ? Math.round(value/total*100) : 0;
  return `<div>
    <div style="display:flex; justify-content:space-between; font-size:12.8px; margin-bottom:3px;"><span>${label}</span><span>${money(value)} · ${pct}%</span></div>
    <div style="height:8px; border-radius:6px; background:var(--surface-alt); overflow:hidden;"><div style="height:100%; width:${pct}%; background:${color};"></div></div>
  </div>`;
}
function svgBarChart(data){
  const w = Math.max(560, data.length*54), h = 190, padL = 8, padB = 26, padT = 14;
  const max = Math.max(1, ...data.map(d=>d.value));
  const usableH = h - padB - padT;
  const barW = (w - padL*2) / data.length * 0.62;
  const gap = (w - padL*2) / data.length;
  let bars = '';
  data.forEach((d,i)=>{
    const bh = max>0 ? (d.value/max)*usableH : 0;
    const x = padL + i*gap + (gap-barW)/2;
    const y = padT + (usableH - bh);
    bars += `<rect class="chart-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(bh,1).toFixed(1)}" rx="2"></rect>`;
    bars += `<text class="chart-label" x="${(x+barW/2).toFixed(1)}" y="${h-8}" text-anchor="middle">${esc(d.label)}</text>`;
    if(d.value>0) bars += `<text class="chart-value" x="${(x+barW/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle">${Math.round(d.value)}€</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><line class="chart-axis" x1="0" y1="${h-padB+0.5}" x2="${w}" y2="${h-padB+0.5}"/>${bars}</svg>`;
}

function saveSettings(){
  Object.assign(db.settings, {nomGarage: val('sNom'), adresse: val('sAdresse'), cp: val('sCp'), ville: val('sVille'), tel: val('sTel'), email: val('sEmail'), siret: val('sSiret'), tvaIntracom: val('sTvaIntra'), tauxTVA: parseFloat(val('sTauxTVA'))||20, mentions: val('sMentions')});
  saveDB(); toast('Paramètres enregistrés.'); render();
}
function handleLogoUpload(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => { db.settings.logo = e.target.result; saveDB(); toast('Logo ajouté.'); render(); };
  reader.readAsDataURL(file);
}
let downloadsCap = null;
async function getDownloads(){ return null; /* téléchargement direct via Blob, voir plus bas */ }
async function exportData(){
  const payload = JSON.stringify(db, null, 2);
  const filename = `garageos-sauvegarde-${TODAY()}.json`;
  const dl = await getDownloads();
  if(dl){ try{ await dl.save({filename, data: payload}); toast('Sauvegarde proposée au téléchargement.'); return; }catch(e){} }
  try{
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast("Impossible de générer le téléchargement dans cet environnement."); }
}
async function exportFacturesCSV(){
  const rows = [['Numero','Date','Client','Statut','Total HT','TVA','Total TTC','Montant regle','Echeance']];
  db.factures.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(f=>{
    const t = docTotals(f);
    rows.push([f.numero, f.date, clientLabel(getClient(f.clientId)), f.statut, t.htApresRemise.toFixed(2), t.tva.toFixed(2), t.ttc.toFixed(2), (f.montantPaye||0).toFixed(2), f.dateEcheance||'']);
  });
  const csv = rows.map(r=>r.map(cell=>{ const s=String(cell==null?'':cell); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }).join(';')).join('\r\n');
  const filename = `garageos-factures-${TODAY()}.csv`;
  const dl = await getDownloads();
  if(dl){ try{ await dl.save({filename, data: '\ufeff'+csv}); toast('Export CSV proposé au téléchargement.'); return; }catch(e){} }
  try{
    const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){ toast("Impossible de générer le téléchargement dans cet environnement."); }
}
function importData(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !parsed.clients){ toast('Fichier invalide.'); return; }
      if(!confirm('Importer ce fichier remplacera toutes les données actuelles. Continuer ?')) return;
      db = Object.assign(defaultDB(), parsed, {settings: Object.assign(defaultDB().settings, parsed.settings||{})});
      saveDB(); toast('Données importées.'); boot(); go('dashboard');
    }catch(err){ toast('Erreur de lecture du fichier.'); }
  };
  reader.readAsText(file);
}
