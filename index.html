<style>
:root{
  box-sizing:border-box;
  --bg:#F1F2EE;
  --surface:#FFFFFF;
  --surface-alt:#E8E9E3;
  --ink:#15181C;
  --ink-soft:#5B6167;
  --ink-faint:#8B9096;
  --border:#DBDDD5;
  --accent:#BC4419;
  --accent-ink:#FFFFFF;
  --accent-soft:#F4E1D6;
  --steel:#2C4759;
  --steel-ink:#FFFFFF;
  --success:#2F7A46;
  --success-soft:#DFF0E3;
  --danger:#AE3327;
  --danger-soft:#F6DFDC;
  --warning:#B4790F;
  --warning-soft:#F5E7C9;
  --radius-s:4px;
  --radius-m:8px;
  --font-head:'Space Grotesk',ui-sans-serif,sans-serif;
  --font-body:'Inter',ui-sans-serif,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171A; --surface:#1C2024; --surface-alt:#23282D; --ink:#EDEEEA; --ink-soft:#AFB4B8;
    --ink-faint:#767C81; --border:#31373C; --accent:#D9723F; --accent-ink:#171008; --accent-soft:#3A2418;
    --steel:#5C7C93; --steel-ink:#0D1418; --success:#4CA868; --success-soft:#1B3624; --danger:#DB7166;
    --danger-soft:#3B211E; --warning:#D9A63E; --warning-soft:#3A2E14;
  }
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2024; --surface-alt:#23282D; --ink:#EDEEEA; --ink-soft:#AFB4B8;
  --ink-faint:#767C81; --border:#31373C; --accent:#D9723F; --accent-ink:#171008; --accent-soft:#3A2418;
  --steel:#5C7C93; --steel-ink:#0D1418; --success:#4CA868; --success-soft:#1B3624; --danger:#DB7166;
  --danger-soft:#3B211E; --warning:#D9A63E; --warning-soft:#3A2E14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; margin:0; letter-spacing:-0.01em;}
a{color:inherit;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

#app{display:flex; height:100vh; height:100dvh;}
.sidebar{
  width:220px; flex:0 0 auto; background:var(--steel); color:var(--steel-ink);
  display:flex; flex-direction:column; padding:16px 10px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  transition:transform .2s ease; z-index:40;
}
.brand{display:flex; align-items:center; gap:9px; padding:6px 8px 18px 8px;}
.brand-mark{width:30px; height:30px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.brand-mark svg{width:18px; height:18px;}
.brand-name{font-family:var(--font-head); font-weight:700; font-size:16.5px; line-height:1.1;}
.brand-sub{font-size:10.5px; opacity:.6; letter-spacing:.03em;}
nav.navlist{display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.navbtn{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:6px; border:none;
  background:transparent; color:var(--steel-ink); opacity:.72; cursor:pointer; text-align:left; width:100%;
  font-size:13.5px; font-weight:500;
}
.navbtn svg{width:17px; height:17px; flex:0 0 auto;}
.navbtn:hover{opacity:1; background:rgba(255,255,255,.08);}
.navbtn.active{opacity:1; background:rgba(255,255,255,.14); font-weight:600;}
.navbtn .badge{margin-left:auto; background:var(--accent); color:var(--accent-ink); font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:20px;}
.sidebar-foot{padding:10px 8px; font-size:11.5px; border-top:1px solid rgba(255,255,255,.12); margin-top:8px; padding-top:12px;}
.sidebar-user{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.sidebar-user .who{opacity:.85;}
.sidebar-user .who b{display:block; font-size:12.5px;}
.sidebar-user .who span{opacity:.65; font-size:10.5px;}
.logout-btn{background:none; border:none; color:var(--steel-ink); opacity:.65; cursor:pointer; padding:4px;}
.logout-btn:hover{opacity:1;}
.sidebar-close{display:none;}

.main{flex:1; min-width:0; display:flex; flex-direction:column; height:100%; overflow:hidden;}
.topbar{
  display:flex; align-items:center; gap:12px; padding:14px 22px; padding-top:calc(14px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border); background:var(--surface); flex:0 0 auto;
}
.topbar h1{font-size:19px;}
.topbar .sub{color:var(--ink-soft); font-size:12.5px; margin-top:1px;}
.hamburger{display:none; background:none; border:1px solid var(--border); border-radius:6px; width:34px; height:34px; align-items:center; justify-content:center; cursor:pointer;}
.view-root{flex:1; overflow-y:auto; padding:22px; padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));}

.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:var(--surface);
  color:var(--ink); padding:8px 13px; border-radius:6px; cursor:pointer; font-weight:600; font-size:13px;
  white-space:nowrap;
}
.btn svg{width:14px; height:14px;}
.btn:hover{border-color:var(--ink-faint);}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-danger{color:var(--danger); border-color:var(--danger-soft);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-ghost{border-color:transparent; background:transparent;}
.btn-ghost:hover{background:var(--surface-alt);}
.btn-sm{padding:5px 9px; font-size:12px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:16px;}
.grid{display:grid; gap:14px;}
.stat-grid{grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); margin-bottom:18px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); padding:15px 16px;}
.stat .label{font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
.stat .value{font-family:var(--font-head); font-size:24px; margin-top:5px; font-weight:700;}
.stat .hint{font-size:11.5px; color:var(--ink-faint); margin-top:3px;}
.stat.warn .value{color:var(--warning);}
.stat.bad .value{color:var(--danger);}
.stat.good .value{color:var(--success);}

.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.toolbar .grow{flex:1; min-width:180px;}
.search{width:100%; padding:8px 11px; border:1px solid var(--border); border-radius:6px; background:var(--surface);}
.search:focus, select:focus, input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}

table{width:100%; border-collapse:collapse; font-size:13.3px;}
.table-wrap{border:1px solid var(--border); border-radius:var(--radius-m); overflow:auto; background:var(--surface);}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:10px 12px; border-bottom:1px solid var(--border); background:var(--surface-alt); white-space:nowrap; position:sticky; top:0;}
td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--surface-alt);}
.num{text-align:right; font-variant-numeric:tabular-nums;}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:12px;}
.empty{padding:40px 20px; text-align:center; color:var(--ink-soft);}
.empty svg{width:34px; height:34px; margin-bottom:10px; opacity:.5;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap;}
.pill-neutral{background:var(--surface-alt); color:var(--ink-soft);}
.pill-good{background:var(--success-soft); color:var(--success);}
.pill-bad{background:var(--danger-soft); color:var(--danger);}
.pill-warn{background:var(--warning-soft); color:var(--warning);}
.pill-accent{background:var(--accent-soft); color:var(--accent);}

.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; background:var(--surface); color:var(--ink);}
.field textarea{resize:vertical; min-height:60px;}
.field-row{display:grid; gap:12px;}
.cols-2{grid-template-columns:1fr 1fr;}
.cols-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:640px){.cols-2,.cols-3{grid-template-columns:1fr;}}

.modal-backdrop{position:fixed; inset:0; background:rgba(10,12,14,.5); display:flex; align-items:flex-start; justify-content:center; padding:30px 16px; overflow-y:auto; z-index:100;}
.modal{background:var(--surface); border-radius:var(--radius-m); width:100%; max-width:560px; padding:20px; border:1px solid var(--border);}
.modal.wide{max-width:820px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-close{background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:4px;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px; padding-top:14px; border-top:1px solid var(--border);}

.section-title{font-size:15px; margin:22px 0 10px 0;}
.section-title:first-child{margin-top:0;}

.doc-head{display:flex; justify-content:space-between; gap:20px; margin-bottom:6px; flex-wrap:wrap;}
.doc-num{font-family:var(--font-head); font-size:21px; font-weight:700;}
.doc-status-row{display:flex; gap:8px; align-items:center; margin-top:6px;}
.doc-meta{font-size:11.5px; color:var(--ink-faint); margin-bottom:16px;}

.lines-table th, .lines-table td{padding:7px 8px;}
.lines-table input, .lines-table select{padding:6px 7px; font-size:12.8px;}
.line-del{color:var(--danger); background:none; border:none; cursor:pointer; padding:4px;}
.totals-box{max-width:300px; margin-left:auto; margin-top:14px;}
.totals-box .row{display:flex; justify-content:space-between; padding:5px 0; font-size:13px;}
.totals-box .row.grand{border-top:1px solid var(--border); margin-top:5px; padding-top:9px; font-weight:700; font-size:15.5px; font-family:var(--font-head);}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:7px; font-size:13px; font-weight:600; z-index:200; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:90vw; text-align:center;}

.low-stock-row{background:var(--warning-soft);}
.retard-row{background:var(--danger-soft);}
.link-btn{background:none;border:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-size:inherit;text-decoration:underline;}

.tabs{display:flex; gap:4px; margin-bottom:16px; border-bottom:1px solid var(--border);}
.tab-btn{background:none; border:none; padding:9px 4px; margin-right:18px; font-weight:600; font-size:13.5px; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}

.login-screen{position:fixed; inset:0; background:var(--steel); display:none; align-items:center; justify-content:center; z-index:300; padding:20px;}
.login-card{background:var(--surface); border-radius:12px; padding:30px; width:100%; max-width:380px; text-align:center;}
.login-mark{width:52px; height:52px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 14px auto;}
.login-mark svg{width:28px; height:28px;}
.user-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
.user-card{border:1px solid var(--border); border-radius:8px; padding:14px 8px; cursor:pointer; background:var(--surface);}
.user-card:hover{border-color:var(--accent); background:var(--accent-soft);}
.user-card .av{width:38px; height:38px; border-radius:50%; background:var(--steel); color:var(--steel-ink); display:flex; align-items:center; justify-content:center; margin:0 auto 8px auto; font-weight:700; font-family:var(--font-head);}
.user-card .name{font-weight:600; font-size:13px;}
.user-card .role{font-size:10.5px; color:var(--ink-faint); margin-top:1px;}
.pinpad{display:flex; gap:8px; justify-content:center; margin:18px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:1px solid var(--border);}
.pin-dot.filled{background:var(--accent); border-color:var(--accent);}
.pin-keys{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:230px; margin:0 auto;}
.pin-key{padding:13px 0; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:17px; font-weight:600; cursor:pointer;}
.pin-key:hover{background:var(--surface-alt);}

.bar-chart{width:100%; overflow-x:auto;}
.bar-chart svg{display:block;}
.chart-bar{fill:var(--accent);}
.chart-axis{stroke:var(--border); stroke-width:1;}
.chart-label{font-size:9.5px; fill:var(--ink-faint); font-family:var(--font-body);}
.chart-value{font-size:9.5px; fill:var(--ink-soft); font-family:var(--font-body); font-weight:600;}
.role-badge{font-size:10px; text-transform:uppercase; font-weight:700; letter-spacing:.03em; padding:1px 7px; border-radius:20px; background:var(--surface-alt); color:var(--ink-soft);}

/* assistant vocal */
.voice-fab{position:fixed; right:22px; bottom:22px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-ink); border:none; box-shadow:0 6px 18px rgba(0,0,0,.25); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:150; transition:transform .15s ease;}
.voice-fab:hover{transform:scale(1.06);}
.voice-fab svg{width:24px; height:24px;}
.voice-fab.listening{background:var(--danger); animation:voicePulse 1.4s ease-in-out infinite;}
@keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(174,51,39,.55);} 50%{box-shadow:0 0 0 14px rgba(174,51,39,0);}}
.voice-panel{position:fixed; right:22px; bottom:88px; max-width:320px; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.2); padding:14px; z-index:150; font-size:13px;}
.voice-panel .vp-status{font-weight:700; margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.voice-panel .vp-transcript{color:var(--ink-soft); font-style:italic; margin-bottom:6px; min-height:18px;}
.voice-panel .vp-answer{white-space:pre-wrap;}
@media(max-width:880px){ .voice-fab{right:16px; bottom:16px;} .voice-panel{right:16px; bottom:80px; max-width:260px;} }

/* planning hebdomadaire */
.week-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.week-grid{display:grid; grid-template-columns:repeat(7,minmax(150px,1fr)); gap:10px; overflow-x:auto; padding-bottom:6px;}
.day-col{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m); display:flex; flex-direction:column; min-height:140px;}
.day-col.today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
.day-col-head{padding:9px 10px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
.day-col-head .dname{font-weight:700; font-size:12.5px; text-transform:capitalize;}
.day-col-head .dnum{font-size:11px; color:var(--ink-faint);}
.day-col-body{padding:8px; display:flex; flex-direction:column; gap:6px; flex:1;}
.day-add{background:none; border:1px dashed var(--border); border-radius:6px; color:var(--ink-faint); padding:5px; cursor:pointer; font-size:11.5px;}
.day-add:hover{border-color:var(--accent); color:var(--accent);}
.rdv-card{background:var(--surface-alt); border-radius:6px; padding:6px 8px; cursor:pointer; font-size:11.8px;}
.rdv-card:hover{outline:1px solid var(--accent);}
.rdv-card .rt{font-weight:700;}
@media(max-width:880px){.week-grid{grid-template-columns:repeat(7,150px);}}

/* print */
#print-area{display:none;}
@media print{
  #app{display:none !important;}
  .toast, .modal-backdrop, .login-screen{display:none !important;}
  #print-area{display:block !important; padding:0; color:#111;}
  #print-area .p-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #111; padding-bottom:14px; margin-bottom:18px;}
  #print-area .p-garage h2{font-size:20px;}
  #print-area .p-garage div{font-size:12px; color:#333; margin-top:2px;}
  #print-area .p-doc{text-align:right;}

/* assistant de configuration */

.scan-top button{background:rgba(255,255,255,.15); border:none; color:#fff; border-radius:50%; width:38px; height:38px; font-size:18px; cursor:pointer;}
#scanReader{flex:1; position:relative;}
#scanReader video{width:100% !important; height:100% !important; object-fit:cover;}
.scan-hint{position:absolute; bottom:24px; left:0; right:0; text-align:center; color:#fff; font-size:13px; padding:0 20px; text-shadow:0 1px 4px rgba(0,0,0,.6); z-index:2;}
.scan-status{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; text-align:center; padding:30px; z-index:1;}

  .btn, .navbtn, .tab-btn, .pin-key, .day-add{ min-height:38px; }

<script>
/* =========================================================================
   GarageOS — application de gestion pour garage automobile
   Stockage: localStorage (par navigateur/poste).
   ========================================================================= */
const DB_KEY = 'garageos_db_v1';
const SESSION_KEY = 'garageos_uid';
/* Toujours construire les dates YYYY-MM-DD à partir des valeurs LOCALES
   (getFullYear/getMonth/getDate), jamais via toISOString() qui convertit
   en UTC et peut faire glisser la date d'un jour selon le fuseau horaire
   (ex: en France, minuit local peut devenir la veille en UTC). */
function toDateStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function toYearMonthStr(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'); return `${y}-${m}`; }
const TODAY = () => toDateStr(new Date());
const NOW_HM = () => new Date().toTimeString().slice(0,5);
function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function defaultDB(){
  return {
    clients: [], vehicules: [], pieces: [], mainOeuvre: [], devis: [], factures: [], rdv: [], utilisateurs: [], fichesTechniques: [], fournisseurs: [],
    settings: {
      nomGarage: 'Mon Garage', adresse: '', cp: '', ville: '', tel: '', email: '', siret: '', tvaIntracom: '',
      tauxTVA: 20,
      mentions: "En cas de retard de paiement, une indemnité forfaitaire de 40€ pour frais de recouvrement est exigible (art. L441-10 C. com.). Devis valable 30 jours.",
      compteurDevis: 0, compteurFacture: 0, logo: '', makeWebhookUrl: '', ctNotifsSent: {}, dernierEnvoiRapportMensuel: '', onboardingDone: false
    }
  };
}
let db = loadDB();
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const base = defaultDB();
    return Object.assign(base, parsed, {settings: Object.assign(base.settings, parsed.settings||{})});
  }catch(e){ console.error('Erreur de chargement', e); return defaultDB(); }
}
function saveDB(){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
  catch(e){ console.error('Erreur de sauvegarde', e); toast("Erreur : impossible d'enregistrer (stockage plein ou indisponible)."); }
}

/* ---------- helpers ---------- */
function money(n){ n = Number(n)||0; return n.toLocaleString('fr-FR',{style:'currency', currency:'EUR'}); }
function fdate(d){ if(!d) return '—'; const dt = new Date(d+'T00:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function clientLabel(c){ if(!c) return '—'; return c.type === 'pro' && c.societe ? c.societe : ((c.prenom||'')+' '+(c.nom||'')).trim() || '(sans nom)'; }
function getClient(id){ return db.clients.find(c=>c.id===id); }
function getVehicule(id){ return db.vehicules.find(v=>v.id===id); }
function vehiculesOf(clientId){ return db.vehicules.filter(v=>v.clientId===clientId); }
function vehiculeLabel(v){ if(!v) return '—'; return [v.marque,v.modele].filter(Boolean).join(' ') + (v.immat? ' · '+v.immat.toUpperCase() : ''); }
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function docTotals(doc){
  let ht = 0, tvaGroups = {};
  (doc.lignes||[]).forEach(l=>{
    const lineHT = (Number(l.qte)||0) * (Number(l.pu)||0);
    ht += lineHT;
    const rate = Number(l.tva)||0;
    tvaGroups[rate] = (tvaGroups[rate]||0) + lineHT * (rate/100);
  });
  let remiseVal = doc.remiseType === 'pct' ? ht * ((Number(doc.remise)||0)/100) : (Number(doc.remise)||0);
  remiseVal = Math.min(remiseVal, ht);
  const htApresRemise = ht - remiseVal;
  const ratioRemise = ht > 0 ? htApresRemise/ht : 1;
  let tva = 0;
  Object.keys(tvaGroups).forEach(r=>{ tva += tvaGroups[r]*ratioRemise; });
  const ttc = htApresRemise + tva;
  return {ht, remiseVal, tva, ttc, htApresRemise};
}
function nextNumero(type){
  const year = new Date().getFullYear();
  if(type==='devis'){ db.settings.compteurDevis++; return `DEV-${year}-${String(db.settings.compteurDevis).padStart(3,'0')}`; }
  db.settings.compteurFacture++; return `FAC-${year}-${String(db.settings.compteurFacture).padStart(3,'0')}`;
}
/* =========================================================================
   AUTOMATISATIONS MAKE
   GarageOS peut déclencher un scénario Make (mêmes identifiants pour tous
   les événements, différenciés par le champ "evenement") sur : nouveau
   client, nouveau rendez-vous, facture créée, paiement reçu, relance
   envoyée, stock bas, CA mensuel. Échec silencieux si Make n'est pas
   connecté — l'app fonctionne normalement sans automatisation.
   ========================================================================= */
/* =========================================================================
   AUTOMATISATIONS MAKE — version autonome (webhook direct)
   GarageOS envoie un vrai appel HTTP au webhook Make à chaque événement.
   Aucune dépendance à Claude ici : ça fonctionne sur n'importe quel
   hébergement, y compris GitHub Pages.
   ========================================================================= */
function getMakeWebhookUrl(){ return (db.settings.makeWebhookUrl||'').trim(); }
let automationsReady = true; // vérifié dynamiquement à chaque envoi selon le réglage du garage
async function initAutomations(){ /* rien à initialiser en mode webhook direct */ }
const AUTOMATION_FIELDS_TEMPLATE = {
  evenement:'', garage_nom:'', client:'', client_email:'', client_telephone:'', type_client:'', vehicule:'', immat:'', date:'', heure:'', motif:'',
  numero_facture:'', montant_ttc:'', montant_regle:'', reste_du:'', echeance:'', statut:'', designation_piece:'', code_piece:'',
  stock_actuel:'', seuil:'', fournisseur_nom:'', fournisseur_email:'', mois:'', ca_ht:'', ca_ttc:'', nb_factures:'', ct_echeance:''
};
async function sendAutomation(evenement, payload){
  const url = getMakeWebhookUrl();
  if(!url) return false;
  try{
    const fullPayload = Object.assign({}, AUTOMATION_FIELDS_TEMPLATE, {evenement, garage_nom: db.settings.nomGarage||''}, payload);
    const res = await fetch(url, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(fullPayload)
    });
    return res.ok;
  }catch(e){ console.warn('Automatisation Make: échec', evenement, e); return false; }
}
function findFournisseurByName(nom){ if(!nom) return null; return db.fournisseurs.find(f=>f.nom.toLowerCase()===nom.toLowerCase()); }
function checkStockAlerts(lignes){
  const seen = new Set();
  (lignes||[]).forEach(l=>{
    if(l.type==='piece' && l.pieceId && !seen.has(l.pieceId)){
      seen.add(l.pieceId);
      const p = db.pieces.find(x=>x.id===l.pieceId);
      if(p && Number(p.stock) <= Number(p.seuil)){
        const fr = findFournisseurByName(p.fournisseur);
        sendAutomation('stock_bas', {designation_piece:p.designation, code_piece:p.ref||'', stock_actuel:String(p.stock), seuil:String(p.seuil), fournisseur_nom:p.fournisseur||'', fournisseur_email: fr?fr.email:''});
      }
    }
  });
}
function maybeSendMonthlyReport(){
  if(!automationsReady) return;
  if(db.clients.length===0) return;
  const ym = toYearMonthStr(new Date());
  if(db.settings.dernierEnvoiRapportMensuel === ym) return;
  const payees = db.factures.filter(f=>f.statut==='payee' && f.date && f.date.startsWith(ym));
  const ht = payees.reduce((s,f)=>s+docTotals(f).htApresRemise,0);
  const ttc = payees.reduce((s,f)=>s+docTotals(f).ttc,0);
  sendAutomation('ca_mensuel', {mois: ym, ca_ht: ht.toFixed(2), ca_ttc: ttc.toFixed(2), nb_factures: String(payees.length)}).then(ok=>{
    if(ok){ db.settings.dernierEnvoiRapportMensuel = ym; saveDB(); }
  });
}
function sendMonthlyReportNow(){
  if(!automationsReady){ toast("Automatisations Make non connectées sur cette vue."); return; }
  const ym = toYearMonthStr(new Date());
  const payees = db.factures.filter(f=>f.statut==='payee' && f.date && f.date.startsWith(ym));
  const ht = payees.reduce((s,f)=>s+docTotals(f).htApresRemise,0);
  const ttc = payees.reduce((s,f)=>s+docTotals(f).ttc,0);
  sendAutomation('ca_mensuel', {mois: ym, ca_ht: ht.toFixed(2), ca_ttc: ttc.toFixed(2), nb_factures: String(payees.length)}).then(ok=>{
    toast(ok ? 'Rapport envoyé vers Make.' : "Échec de l'envoi vers Make.");
    if(ok){ db.settings.dernierEnvoiRapportMensuel = ym; saveDB(); }
  });
}
function maybeSendCtReminders(){
  if(!automationsReady) return;
  db.settings.ctNotifsSent = db.settings.ctNotifsSent || {};
  const today = TODAY();
  db.vehicules.forEach(v=>{
    if(!v.prochainCT) return;
    const j = Math.round((new Date(v.prochainCT+'T00:00:00') - new Date(today+'T00:00:00'))/86400000);
    if(j<0 || j>30) return; // seulement entre 0 et 30 jours avant échéance
    const already = db.settings.ctNotifsSent[v.id];
    if(already === v.prochainCT) return; // déjà envoyé pour cette échéance précise
    const c = getClient(v.clientId);
    sendAutomation('ct_a_prevoir', {client: clientLabel(c), client_email: c?.email||'', client_telephone: c?.tel||'', vehicule: vehiculeLabel(v), immat: v.immat||'', ct_echeance: v.prochainCT}).then(ok=>{
      if(ok){ db.settings.ctNotifsSent[v.id] = v.prochainCT; saveDB(); }
    });
  });
}

/* =========================================================================
   ASSISTANT VOCAL
   Reconnaissance vocale du navigateur (Web Speech API) + interprétation
   de la commande via la capacité "sample" (Claude), pour comprendre des
   phrases libres plutôt qu'une liste rigide de mots-clés.
   ========================================================================= */
/* =========================================================================
   ASSISTANT VOCAL — version autonome (compréhension locale, sans clé API)
   -------------------------------------------------------------------------
   Pourquoi pas d'IA ici : appeler l'API Anthropic depuis le navigateur
   exigerait d'exposer ta clé API dans le code de la page (visible par
   n'importe qui via les outils développeur) — un vrai risque de sécurité
   et de facturation. Une IA fiable nécessite un petit serveur relais
   (fonction Netlify/Cloudflare) qui garde la clé secrète : un projet
   possible plus tard, mais pas sur une page 100% statique comme celle-ci.
   En attendant, cette reconnaissance par mots-clés couvre les commandes
   les plus utiles sans dépendance externe.
   ========================================================================= */
let voiceRecognition = null;
let voiceListening = false;
function getSpeechRecognitionCtor(){ return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
function showVoicePanel(html){ const p = document.getElementById('voicePanel'); p.style.display='block'; p.innerHTML = html; }
function hideVoicePanelSoon(delay){ setTimeout(()=>{ const p = document.getElementById('voicePanel'); if(p && !voiceListening) p.style.display='none'; }, delay||4000); }
function speak(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = 1.02;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function toggleVoice(){
  if(voiceListening){ stopVoice(); return; }
  const Ctor = getSpeechRecognitionCtor();
  if(!Ctor){ toast("Reconnaissance vocale non disponible dans ce navigateur — essaie Chrome ou Edge."); return; }
  try{
    voiceRecognition = new Ctor();
    voiceRecognition.lang = 'fr-FR';
    voiceRecognition.interimResults = true;
    voiceRecognition.maxAlternatives = 1;
    voiceRecognition.continuous = false;
    voiceListening = true;
    document.getElementById('voiceFab').classList.add('listening');
    showVoicePanel(`<div class="vp-status">🎙️ Je t'écoute…</div><div class="vp-transcript" id="vpTranscript">Parle maintenant.</div>`);
    voiceRecognition.onresult = (ev)=>{
      let transcript = '';
      for(let i=0;i<ev.results.length;i++) transcript += ev.results[i][0].transcript;
      const el = document.getElementById('vpTranscript'); if(el) el.textContent = transcript;
      if(ev.results[ev.results.length-1].isFinal){ handleVoiceTranscript(transcript.trim()); }
    };
    voiceRecognition.onerror = (ev)=>{
      stopVoiceUI();
      if(ev.error==='no-speech'){ showVoicePanel(`<div class="vp-status">🎙️ Rien entendu</div><div class="vp-transcript">Réessaie en te rapprochant du micro.</div>`); hideVoicePanelSoon(3000); }
      else if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){ toast("Micro refusé — autorise l'accès au micro pour ce site dans ton navigateur."); document.getElementById('voicePanel').style.display='none'; }
      else if(ev.error==='audio-capture'){ showVoicePanel(`<div class="vp-status">🎙️ Aucun micro détecté</div>`); hideVoicePanelSoon(3000); }
      else { hideVoicePanelSoon(2000); }
    };
    voiceRecognition.onend = ()=>{ stopVoiceUI(); };
    voiceRecognition.start();
  }catch(e){ stopVoiceUI(); toast("Impossible de démarrer le micro."); }
}
function stopVoiceUI(){ voiceListening=false; const fab=document.getElementById('voiceFab'); if(fab) fab.classList.remove('listening'); }
function stopVoice(){ try{ voiceRecognition && voiceRecognition.stop(); }catch(e){} stopVoiceUI(); }

const VOICE_NAV_WORDS = {
  dashboard: ['tableau de bord','accueil','dashboard'],
  planning: ['planning','agenda','rendez-vous','rendez vous'],
  clients: ['client','clients'],
  vehicules: ['véhicule','vehicule','véhicules','vehicules','voiture','voitures'],
  fiches: ['fiche technique','fiches techniques','fiche','couple de serrage','rta'],
  devis: ['devis'],
  factures: ['facture','factures'],
  stock: ['stock','catalogue','pièce','piece','pièces','pieces','main d\u2019œuvre','main d\u2019oeuvre','fournisseur','fournisseurs'],
  rapports: ['rapport','rapports','statistique','statistiques'],
  utilisateurs: ['utilisateur','utilisateurs','équipe','equipe'],
  parametres: ['paramètre','parametre','paramètres','parametres','réglage','reglage']
};
const VOICE_CREATE_WORDS = {
  client: ['client'], vehicule: ['véhicule','vehicule','voiture'], rdv: ['rendez-vous','rendez vous'],
  devis: ['devis'], facture: ['facture'], piece: ['pièce','piece'], mo: ['main d\u2019œuvre','main d\u2019oeuvre','opération','operation'],
  fournisseur: ['fournisseur'], fiche: ['fiche technique','fiche']
};
function normalizeVoice(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function matchAny(text, words){ return words.some(w=>text.includes(normalizeVoice(w))); }

function handleVoiceTranscript(transcriptRaw){
  const transcript = transcriptRaw||'';
  const t = normalizeVoice(transcript);
  if(!t){ hideVoicePanelSoon(1000); return; }

  // 1) création : "nouveau/nouvelle/crée/ajoute ... X"
  if(/(nouveau|nouvelle|crée|cree|créer|creer|ajoute|ajouter)/.test(t)){
    for(const [form, words] of Object.entries(VOICE_CREATE_WORDS)){
      if(matchAny(t, words)){
        const map = {client:openClientForm, vehicule:openVehiculeForm, rdv:()=>openRdvForm(null,TODAY()), devis:()=>go('devisEdit',{}), facture:()=>go('factureEdit',{}), piece:openPieceForm, mo:openMoForm, fournisseur:openFournisseurForm, fiche:()=>go('ficheEdit',{})};
        map[form]();
        showVoicePanel(`<div class="vp-status">✅ C'est ouvert</div>`); hideVoicePanelSoon(1200);
        return;
      }
    }
  }
  // 2) recherche : "cherche/trouve X" (dans la vue courante si compatible, sinon clients)
  const searchMatch = transcript.match(/(?:cherche|trouve|recherche)\s+(.+)/i);
  if(searchMatch){
    const query = searchMatch[1].trim();
    const searchableViews = ['clients','vehicules','devis','factures','stock'];
    const view = searchableViews.includes(state.view) ? state.view : 'clients';
    go(view, {q: query});
    showVoicePanel(`<div class="vp-status">🔎 Recherche : ${esc(query)}</div>`); hideVoicePanelSoon(1800);
    return;
  }
  // 3) questions sur l'activité (réponses calculées localement, jamais inventées)
  if(/combien|est-ce qu.?il y a|y a-t-il|quel est|montant|impaye|impayé|retard/.test(t)){
    const snap = buildVoiceSnapshot();
    let reponse = null;
    if(t.includes('rendez')) reponse = `Tu as ${snap.rendezvous_aujourdhui} rendez-vous aujourd'hui.`;
    else if(t.includes('impaye')) reponse = `${snap.factures_impayees} facture(s) impayée(s), pour un total de ${snap.montant_total_impaye_euros} euros.`;
    else if(t.includes('retard')) reponse = `${snap.factures_en_retard} facture(s) en retard.`;
    else if(t.includes('stock')) reponse = snap.pieces_stock_bas.length ? `${snap.pieces_stock_bas.length} pièce(s) en stock bas : ${snap.pieces_stock_bas.map(p=>p.designation).join(', ')}.` : "Aucune pièce en stock bas, tout est au vert.";
    else if(t.includes('chiffre') || t.includes('ca ') || t.includes('encaisse')) reponse = `Le chiffre d'affaires encaissé ce mois-ci est de ${snap.chiffre_affaires_encaisse_ce_mois_euros} euros.`;
    else if(t.includes('controle technique') || t.includes('ct ')) reponse = `${snap.controles_techniques_a_prevoir_30j} contrôle(s) technique(s) à prévoir dans les 30 jours.`;
    if(reponse){
      showVoicePanel(`<div class="vp-status">🔧 GarageOS</div><div class="vp-answer">${esc(reponse)}</div>`);
      speak(reponse); hideVoicePanelSoon(6000);
      return;
    }
  }
  // 4) navigation : cherche un mot-clé de vue dans la phrase
  for(const [view, words] of Object.entries(VOICE_NAV_WORDS)){
    if(matchAny(t, words)){
      go(view);
      showVoicePanel(`<div class="vp-status">✅ ${document.getElementById('pageTitle').textContent}</div>`);
      hideVoicePanelSoon(1500);
      return;
    }
  }
  // 5) rien reconnu
  showVoicePanel(`<div class="vp-status">Je n'ai pas compris</div><div class="vp-transcript">« ${esc(transcript)} »</div><div style="font-size:11.5px; color:var(--ink-faint); margin-top:6px;">Essaie : "ouvre les factures", "nouveau client", "cherche Dupont", "combien j'ai de rendez-vous aujourd'hui".</div>`);
  hideVoicePanelSoon(5000);
}
function buildVoiceSnapshot(){
  const now = new Date(); const ym = toYearMonthStr(now);
  const rdvToday = db.rdv.filter(r=>r.date===TODAY() && r.statut!=='annule').length;
  const facturesImpayees = db.factures.filter(f=>f.statut!=='payee');
  const montantImpaye = facturesImpayees.reduce((s,f)=>{ const t=docTotals(f).ttc; return s+Math.max(t-(f.montantPaye||0),0); },0);
  const enRetard = db.factures.filter(isEnRetard).length;
  const caMois = db.factures.filter(f=>f.date && f.date.startsWith(ym) && f.statut==='payee').reduce((s,f)=>s+docTotals(f).ttc,0);
  const stockBas = db.pieces.filter(p=>Number(p.stock)<=Number(p.seuil));
  const ctSoon = db.vehicules.filter(v=>v.prochainCT && Math.round((new Date(v.prochainCT+'T00:00:00')-new Date(TODAY()+'T00:00:00'))/86400000)<=30).length;
  return {
    rendezvous_aujourdhui: rdvToday, factures_impayees: facturesImpayees.length,
    montant_total_impaye_euros: Math.round(montantImpaye*100)/100, factures_en_retard: enRetard,
    chiffre_affaires_encaisse_ce_mois_euros: Math.round(caMois*100)/100,
    pieces_stock_bas: stockBas.map(p=>({designation:p.designation, stock:p.stock, seuil:p.seuil})),
    controles_techniques_a_prevoir_30j: ctSoon
  };
}

function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return toDateStr(d); }
function mondayOf(dateStr){ const d = new Date(dateStr+'T00:00:00'); const day = d.getDay(); const diff = (day===0?-6:1-day); d.setDate(d.getDate()+diff); return toDateStr(d); }
function isEnRetard(f){ return f.statut!=='payee' && f.dateEcheance && f.dateEcheance < TODAY(); }

function onboardNext1(){
  onboardData.nomGarage = val('obNom') || 'Mon Garage';
  onboardData.adresse = val('obAdresse'); onboardData.ville = val('obVille'); onboardData.cp = val('obCp'); onboardData.tel = val('obTel');
  onboardData.tauxTVA = parseFloat(val('obTva'))||20;
  onboardStep = 2; renderOnboarding();
}
function onboardSkip2(){ onboardData.adminNom=''; onboardData.adminPin=''; onboardStep = 3; renderOnboarding(); }
function onboardNext2(){
  const nom = val('obAdminNom'); const pin = val('obAdminPin');
  if(nom && pin){
    if(!/^\d{4}$/.test(pin)){ toast('Le code PIN doit contenir exactement 4 chiffres.'); return; }
    onboardData.adminNom = nom; onboardData.adminPin = pin;
  }
  onboardStep = 3; renderOnboarding();
}
function finishOnboarding(){
  Object.assign(db.settings, {nomGarage: onboardData.nomGarage, adresse: onboardData.adresse, ville: onboardData.ville, cp: onboardData.cp, tel: onboardData.tel, tauxTVA: onboardData.tauxTVA, onboardingDone: true});
  if(onboardData.adminNom && onboardData.adminPin){
    db.utilisateurs.push({id: uid('usr'), nom: onboardData.adminNom, role:'admin', pin: onboardData.adminPin, actif:true});
  }
  saveDB();
  document.getElementById('onboardScreen').style.display='none';
  boot();
}
function boot(){
  if(needsOnboarding()){ showOnboarding(); return; }
  const u = getSessionUser();
  if(!u){ showLogin(); } else { showApp(); render(); }
  initAutomations().then(()=>{ maybeSendMonthlyReport(); maybeSendCtReminders(); });
}

function showLogin(){ document.getElementById('app').style.display='none'; renderLogin(); document.getElementById('loginScreen').style.display='flex'; }

          ${db.utilisateurs.filter(u=>u.actif!==false).map(u=>`
            <div class="user-card" onclick="loginStep.userId='${u.id}'; loginStep.pin=''; renderLogin();">

              <div class="name">${esc(u.nom)}</div><div class="role">${roleLabel(u.role)}</div>
            </div>`).join('')}
        </div>
      </div>`;
  } else {
    const u = db.utilisateurs.find(x=>x.id===loginStep.userId);
    el.innerHTML = `
      <div class="login-card">
        <div class="login-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
        <h2>${esc(u.nom)}</h2>
        <div style="color:var(--ink-soft); font-size:12.8px; margin-top:4px;">Entrez votre code à 4 chiffres</div>
        <div class="pinpad">${[0,1,2,3].map(i=>`<div class="pin-dot ${loginStep.pin.length>i?'filled':''}"></div>`).join('')}</div>
        <div class="pin-keys">
          ${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" class="pin-key" onclick="pinPress('${n}')">${n}</button>`).join('')}
          <button type="button" class="pin-key" onclick="loginStep.userId=null; renderLogin();">←</button>
          <button type="button" class="pin-key" onclick="pinPress('0')">0</button>
          <button type="button" class="pin-key" onclick="pinPress('del')">⌫</button>
        </div>
      </div>`;
  }
}
function pinPress(k){
  if(k==='del'){ loginStep.pin = loginStep.pin.slice(0,-1); renderLogin(); return; }
  if(loginStep.pin.length>=4) return;
  loginStep.pin += k; renderLogin();
  if(loginStep.pin.length===4){
    const u = db.utilisateurs.find(x=>x.id===loginStep.userId);
    if(u && u.pin === loginStep.pin){
      sessionStorage.setItem(SESSION_KEY, u.id); loginStep = {userId:null, pin:''}; showApp(); render();
    } else {
      setTimeout(()=>{ toast('Code incorrect.'); loginStep.pin=''; renderLogin(); }, 200);
    }
  }
}
function logout(){ sessionStorage.removeItem(SESSION_KEY); loginStep={userId:null,pin:''}; boot(); }
function roleLabel(r){ return {admin:'Administrateur', secretaire:'Accueil / Secrétariat', mecanicien:'Mécanicien'}[r] || r; }

function renderNav(){
  const lowStock = db.pieces.filter(p=>Number(p.stock) <= Number(p.seuil)).length;
  const impayees = db.factures.filter(f=>f.statut!=='payee').length;
  const rdvToday = db.rdv.filter(r=>r.date===TODAY() && r.statut!=='annule').length;
  const hidden = HIDDEN_FOR[currentRole()] || [];
  const el = document.getElementById('navlist');
  el.innerHTML = NAV.filter(n=>!hidden.includes(n.id)).map(n=>{
    let badge = '';
    if(n.id==='stock' && lowStock>0) badge = `<span class="badge">${lowStock}</span>`;
    if(n.id==='factures' && impayees>0) badge = `<span class="badge">${impayees}</span>`;
    if(n.id==='planning' && rdvToday>0) badge = `<span class="badge">${rdvToday}</span>`;
    return `<button class="navbtn ${state.view===n.id?'active':''}" onclick="go('${n.id}')">${n.icon()}<span>${n.label}</span>${badge}</button>`;
  }).join('');
  const u = getSessionUser();
  const foot = document.getElementById('sidebarFoot');
  if(db.utilisateurs.length===0){ foot.innerHTML = `<div style="opacity:.6;">Données stockées localement.</div>`; }
  else { foot.innerHTML = `<div class="sidebar-user"><div class="who"><b>${esc(u.nom)}</b><span>${roleLabel(u.role)}</span></div><button class="logout-btn" onclick="logout()" title="Se déconnecter">${icoBack()}</button></div>`; }
}

function render(){
  const hidden = HIDDEN_FOR[currentRole()] || [];
  if(hidden.includes(state.view)){ state = {view:'dashboard', params:{}}; }
  renderNav();
  const root = document.getElementById('viewRoot');
  const titleEl = document.getElementById('pageTitle');
  const subEl = document.getElementById('pageSub');
  const map = {
    dashboard: [viewDashboard, 'Tableau de bord', "Vue d'ensemble de l'activité du garage"],

    stock: [viewCatalogue, 'Catalogue & stock', "Pièces et main d'œuvre"],
    rapports: [viewRapports, 'Rapports', 'Rentabilité et statistiques du garage'],

    parametres: [viewParametres, 'Paramètres', 'Informations du garage et préférences'],

function viewDashboard(root){
  const now = new Date();
  const ym = toYearMonthStr(now);
  const caMois = db.factures.filter(f=>f.date && f.date.startsWith(ym) && f.statut==='payee').reduce((s,f)=>s+docTotals(f).ttc,0);
  const impayees = db.factures.filter(f=>f.statut!=='payee');
  const montantImpaye = impayees.reduce((s,f)=>{ const t = docTotals(f).ttc; const paye = Number(f.montantPaye)||0; return s + Math.max(t-paye,0); },0);
  const enRetard = db.factures.filter(isEnRetard);
  const devisAttente = db.devis.filter(d=>d.statut==='envoye' || d.statut==='brouillon');
  const lowStock = db.pieces.filter(p=>Number(p.stock) <= Number(p.seuil));
  const rdvToday = db.rdv.filter(r=>r.date===TODAY() && r.statut!=='annule').sort((a,b)=>a.heure.localeCompare(b.heure));
  const rdvUpcoming = db.rdv.filter(r=>r.date>TODAY() && r.statut!=='annule').sort((a,b)=>(a.date+a.heure).localeCompare(b.date+b.heure)).slice(0,5);
  const ctSoon = db.vehicules.filter(v=>v.prochainCT).filter(v=>{ const j = Math.round((new Date(v.prochainCT+'T00:00:00') - new Date(TODAY()+'T00:00:00'))/86400000); return j<=30; }).sort((a,b)=>a.prochainCT.localeCompare(b.prochainCT));
  root.innerHTML = `
    <div class="toolbar" style="margin-bottom:16px;">
      <div style="flex:1"></div>
      <button class="btn btn-primary" onclick="openPlateScanner()">📷 Un véhicule arrive — scanner sa plaque</button>
    </div>
    <div class="grid stat-grid">
      <div class="stat good"><div class="label">CA encaissé — ${monthLabel(now)}</div><div class="value">${money(caMois)}</div><div class="hint">factures payées ce mois-ci</div></div>
      <div class="stat ${montantImpaye>0?'bad':''}"><div class="label">Impayés</div><div class="value">${money(montantImpaye)}</div><div class="hint">${impayees.length} facture(s)</div></div>
      <div class="stat ${enRetard.length>0?'bad':''}"><div class="label">En retard</div><div class="value">${enRetard.length}</div><div class="hint">échéance dépassée</div></div>
      <div class="stat"><div class="label">Devis en cours</div><div class="value">${devisAttente.length}</div><div class="hint">brouillon ou envoyé</div></div>
      <div class="stat"><div class="label">RDV aujourd'hui</div><div class="value">${rdvToday.length}</div><div class="hint">rendez-vous planifiés</div></div>
      <div class="stat ${lowStock.length>0?'warn':''}"><div class="label">Stock bas</div><div class="value">${lowStock.length}</div><div class="hint">référence(s) sous le seuil</div></div>
      <div class="stat ${ctSoon.length>0?'warn':''}"><div class="label">CT à prévoir</div><div class="value">${ctSoon.length}</div><div class="hint">dans les 30 jours ou dépassé</div></div>
    </div>
    ${ctSoon.length>0?`<div class="card" style="margin-bottom:14px;">
      <h3 style="margin-bottom:10px;">Contrôles techniques à surveiller</h3>
      <div class="table-wrap"><table><thead><tr><th>Véhicule</th><th>Client</th><th>Échéance</th></tr></thead><tbody>
      ${ctSoon.map(v=>`<tr onclick="go('vehiculeDetail',{id:'${v.id}'})"><td>${esc(vehiculeLabel(v))}</td><td>${esc(clientLabel(getClient(v.clientId)))}</td><td>${ctPill(v)}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`:''}
    <div class="grid" style="grid-template-columns:1.3fr 1fr;">
      <div class="card"><h3 style="margin-bottom:12px;">Dernières factures</h3>${renderMiniFacturesTable(db.factures.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6))}</div>
      <div style="display:flex; flex-direction:column; gap:14px;">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;"><h3>Aujourd'hui</h3><button class="btn btn-sm" onclick="go('planning')">Planning</button></div>
          ${rdvToday.length===0?`<div class="empty" style="padding:14px;">Aucun rendez-vous aujourd'hui.</div>`:
            rdvToday.map(r=>`<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:12.8px;"><span><strong>${esc(r.heure)}</strong> · ${esc(rdvClientLabel(r))}</span>${rdvStatutPill(r)}</div>`).join('')}
        </div>
        <div class="card">
          <h3 style="margin-bottom:10px;">Alertes stock</h3>
          ${lowStock.length===0 ? `<div class="empty" style="padding:14px;">Stock au vert.</div>` :
            lowStock.slice(0,5).map(p=>`<div style="display:flex; justify-content:space-between; align-items:center; font-size:12.8px; padding:6px 0; border-bottom:1px solid var(--border);"><strong>${esc(p.designation)}</strong><span class="pill pill-warn">${p.stock}/${p.seuil}</span></div>`).join('')}
        </div>
      </div>
    </div>
    ${rdvUpcoming.length>0?`<div class="card" style="margin-top:14px;">
      <h3 style="margin-bottom:10px;">Prochains rendez-vous</h3>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Heure</th><th>Client</th><th>Véhicule</th><th>Motif</th></tr></thead><tbody>
      ${rdvUpcoming.map(r=>`<tr onclick="go('planning',{weekStart:'${mondayOf(r.date)}'})"><td>${fdate(r.date)}</td><td>${esc(r.heure)}</td><td>${esc(rdvClientLabel(r))}</td><td>${esc(rdvVehiculeLabel(r))}</td><td>${esc(r.motif||'—')}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`:''}
  `;
}
function monthLabel(d){ return d.toLocaleDateString('fr-FR',{month:'long', year:'numeric'}); }
function renderMiniFacturesTable(list){
  if(list.length===0) return `<div class="empty" style="padding:20px;">${icoInbox()}<div>Aucune facture pour le moment.</div></div>`;
  return `<div class="table-wrap"><table><thead><tr><th>N°</th><th>Client</th><th>Date</th><th class="num">Total TTC</th><th>Statut</th></tr></thead><tbody>
    ${list.map(f=>`<tr onclick="go('factureEdit',{id:'${f.id}'})"><td>${esc(f.numero)}</td><td>${esc(clientLabel(getClient(f.clientId)))}</td><td>${fdate(f.date)}</td><td class="num">${money(docTotals(f).ttc)}</td><td>${statutPill(f)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function statutPill(f){
  if(isEnRetard(f)) return `<span class="pill pill-bad">${icoAlert()} En retard</span>`;
  const map = {payee:['Payée','pill-good'], impayee:['Impayée','pill-neutral'], partielle:['Partielle','pill-warn']};
  const s = map[f.statut] || map.impayee;
  return `<span class="pill ${s[1]}">${s[0]}</span>`;
}
function statutDevisPill(d){
  const map = {brouillon:['Brouillon','pill-neutral'], envoye:['Envoyé','pill-accent'], accepte:['Accepté','pill-good'], refuse:['Refusé','pill-bad'], facture:['Facturé','pill-good']};
  const s = map[d.statut] || map.brouillon; return `<span class="pill ${s[1]}">${s[0]}</span>`;
}
function rdvStatutPill(r){
  const map = {planifie:['Planifié','pill-neutral'], confirme:['Confirmé','pill-accent'], termine:['Terminé','pill-good'], annule:['Annulé','pill-bad']};
  const s = map[r.statut] || map.planifie; return `<span class="pill ${s[1]}">${s[0]}</span>`;
}

/* =========================================================================
   PLANNING — vue hebdomadaire
   ========================================================================= */
function viewPlanning(root){
  const weekStart = state.params.weekStart || mondayOf(TODAY());
  const days = [...Array(7)].map((_,i)=>addDays(weekStart,i));
  const weekEnd = days[6];
  const noms = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  root.innerHTML = `
    <div class="week-toolbar">
      <button class="btn btn-sm" onclick="go('planning',{weekStart:'${addDays(weekStart,-7)}'})">◀ Semaine préc.</button>
      <input type="date" class="search" style="max-width:170px;" value="${weekStart}" onchange="go('planning',{weekStart: mondayOf(this.value)})">
      <button class="btn btn-sm" onclick="go('planning',{weekStart:'${addDays(weekStart,7)}'})">Semaine suiv. ▶</button>
      <button class="btn btn-sm" onclick="go('planning',{weekStart: mondayOf(TODAY())})">Cette semaine</button>
      <div style="flex:1"></div>
      <button class="btn btn-primary" onclick="openRdvForm(null,'${TODAY()}')">${icoPlus()} Nouveau rendez-vous</button>
    </div>
    <div class="card" style="margin-bottom:14px;"><strong>Semaine du ${fdate(weekStart)} au ${fdate(weekEnd)}</strong> · ${db.rdv.filter(r=>r.date>=weekStart && r.date<=weekEnd).length} rendez-vous</div>
    <div class="week-grid">
      ${days.map((d,i)=>{
        const dayRdv = db.rdv.filter(r=>r.date===d).sort((a,b)=>a.heure.localeCompare(b.heure));
        const isToday = d===TODAY();
        return `<div class="day-col ${isToday?'today':''}">
          <div class="day-col-head"><span class="dname">${noms[i]}</span><span class="dnum">${fdate(d).slice(0,5)}</span></div>
          <div class="day-col-body">
            ${dayRdv.length===0?'':dayRdv.map(r=>`<div class="rdv-card" onclick="openRdvForm('${r.id}')"><div class="rt">${esc(r.heure)}</div><div>${esc(rdvClientLabel(r))}</div>${r.motif?`<div style="color:var(--ink-faint);">${esc(r.motif)}</div>`:''}</div>`).join('')}
            <button class="day-add" onclick="openRdvForm(null,'${d}')">+ Ajouter</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}
function openRdvForm(id, presetDate){

/* =========================================================================
   RECHERCHE EN DIRECT (sans perte de focus)
   Principe : les champs de recherche ne sont jamais reconstruits pendant la
   frappe — seule la zone de résultats (tbody) est mise à jour.
   ========================================================================= */

   ========================================================================= */
let sortState = {};
function thSort(view, key, label){
  const s = sortState[view];
  const active = s && s.key===key;
  const arrow = active ? (s.dir===1?'▲':'▼') : '⇅';
  return `<th class="sortable ${active?'sorted':''}" onclick="toggleSort('${view}','${key}')">${label}<span class="arrow">${arrow}</span></th>`;
}
const SORT_RERENDER = {
  clients: ()=>filterClients(state.params.q||''),
  factures: ()=>filterFactures(state.params.q||'')
};
function toggleSort(view, key){
  const s = sortState[view] || {key:null, dir:1};
  if(s.key===key) s.dir = -s.dir; else { s.key = key; s.dir = 1; }
  sortState[view] = s;
  if(SORT_RERENDER[view]) SORT_RERENDER[view]();
}
function applySort(view, list, getters){
  const s = sortState[view];
  if(!s || !s.key || !getters[s.key]) return list;
  const get = getters[s.key];
  return list.slice().sort((a,b)=>{
    const va = get(a), vb = get(b);
    if(va<vb) return -1*s.dir; if(va>vb) return 1*s.dir; return 0;
  });
}

/* =========================================================================
   SCANNER DE PLAQUE D'IMMATRICULATION — reconnaissance de texte (OCR)
   -------------------------------------------------------------------------
   Contrairement aux codes-barres, une plaque est du texte à lire : la
   fiabilité dépend de la photo (netteté, lumière, angle bien de face).
   Une confirmation manuelle est toujours proposée avant la recherche pour
   éviter qu'une lettre mal reconnue fasse échouer la recherche.
   ========================================================================= */
let plateStream = null;
function openPlateScanner(){
  if(typeof Tesseract === 'undefined'){ toast("Le module de lecture de plaque n'a pas pu se charger — vérifie ta connexion internet et réessaie."); return; }
  const screenEl = document.getElementById('plateScreen');
  screenEl.classList.add('open');
  screenEl.style.height = (window.visualViewport ? window.visualViewport.height : window.innerHeight) + 'px';
  document.getElementById('plateHint').textContent = 'Cadre la plaque bien à plat et éclairée, puis appuie sur le déclencheur.';
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: {ideal:1280}, height:{ideal:720} } }).then(stream=>{
    plateStream = stream;
    const video = document.getElementById('plateVideo');
    video.srcObject = stream;
  }).catch(err=>{
    document.getElementById('plateHint').textContent = "Impossible d'accéder à la caméra — vérifie l'autorisation dans ton navigateur.";
    console.warn('Erreur caméra plaque', err);
  });
}
function closePlateScanner(){
  document.getElementById('plateScreen').classList.remove('open');
  if(plateStream){ plateStream.getTracks().forEach(t=>t.stop()); plateStream = null; }
}
async function capturePlate(){
  const video = document.getElementById('plateVideo');
  if(!video.videoWidth){ toast('La caméra ne semble pas prête, réessaie dans une seconde.'); return; }
  document.getElementById('plateHint').textContent = 'Lecture de la plaque en cours…';

  // 1) Calculer la zone exacte visée par le cadre blanc (et pas toute l'image)
  const wrap = document.getElementById('plateVideoWrap');
  const guide = document.getElementById('plateGuide');
  const containerW = wrap.clientWidth, containerH = wrap.clientHeight;
  const videoW = video.videoWidth, videoH = video.videoHeight;
  const scale = Math.max(containerW / videoW, containerH / videoH); // object-fit: cover
  const displayedW = videoW * scale, displayedH = videoH * scale;
  const offsetX = (displayedW - containerW) / 2, offsetY = (displayedH - containerH) / 2;
  const guideW = containerW * 0.80, guideH = guideW / 4.7;
  const guideLeft = (containerW - guideW) / 2, guideTop = (containerH - guideH) / 2;
  const srcX = (guideLeft + offsetX) / scale, srcY = (guideTop + offsetY) / scale;
  const srcW = guideW / scale, srcH = guideH / scale;

  // 2) Découper cette zone et l'agrandir pour donner plus de matière à l'OCR
  const canvas = document.getElementById('plateCanvas');
  const destW = 900, destH = Math.round(900 / 4.7);
  canvas.width = destW; canvas.height = destH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, srcX, srcY, srcW, srcH, 0, 0, destW, destH);

  // 3) Nettoyage d'image : niveaux de gris + étirement du contraste
  preprocessForOcr(canvas);

  try{
    const worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
      tessedit_pageseg_mode: '7' // une seule ligne de texte
    });
    const result = await worker.recognize(canvas);
    await worker.terminate();
    closePlateScanner();
    const candidate = extractPlateCandidate(result.data.text || '');
    showPlateConfirm(candidate);
  }catch(e){
    console.warn('Erreur OCR plaque', e);
    document.getElementById('plateHint').textContent = 'Échec de la lecture — réessaie avec une photo plus nette.';
  }
}
function preprocessForOcr(canvas){
  const ctx = canvas.getContext('2d');
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  const gray = new Float32Array(d.length / 4);
  let min = 255, max = 0;
  for(let i=0, j=0; i<d.length; i+=4, j++){
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    gray[j] = g; if(g<min) min=g; if(g>max) max=g;
  }
  const range = Math.max(1, max-min);
  for(let i=0, j=0; i<d.length; i+=4, j++){
    const v = Math.round(((gray[j]-min)/range) * 255);
    d[i] = d[i+1] = d[i+2] = v;
  }
  ctx.putImageData(imgData, 0, 0);
}
function normalizePlate(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function extractPlateCandidate(rawText){
  const upper = rawText.toUpperCase();
  // format SIV actuel : AA-123-AA
  let m = upper.match(/([A-Z]{2}[\s-]?\d{3}[\s-]?[A-Z]{2})/);
  if(m) return normalizePlate(m[1]);
  // ancien format FNI : 1234 AB 56
  m = upper.match(/(\d{1,4}[\s-]?[A-Z]{1,3}[\s-]?\d{2,3})/);
  if(m) return normalizePlate(m[1]);
  // repli : le plus long segment alphanumérique trouvé
  const tokens = upper.replace(/[^A-Z0-9\s]/g,' ').split(/\s+/).filter(Boolean);
  return normalizePlate(tokens.sort((a,b)=>b.length-a.length)[0] || '');
}

/* =========================================================================
   PHOTOS VÉHICULE — état des lieux, avant/après intervention
   Les images sont redimensionnées et compressées côté navigateur avant
   stockage (localStorage a une capacité limitée, quelques Mo en général).
   ========================================================================= */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        const scale = Math.min(1, (maxDim||1000)/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function addVehiculePhotos(vehiculeId, input){
  const files = Array.from(input.files||[]);
  if(files.length===0) return;
  const v = getVehicule(vehiculeId); if(!v) return;
  v.photos = v.photos || [];
  toast(`Ajout de ${files.length} photo(s)…`);
  for(const file of files){
    try{
      const dataUrl = await compressImageFile(file, 1000, 0.72);
      v.photos.push({id: uid('pho'), dataUrl, date: TODAY()});
    }catch(e){ console.warn('Erreur photo', e); }
  }
  try{ saveDB(); toast('Photos ajoutées.'); render(); }
  catch(e){ toast('Stockage plein — supprime quelques photos ou exporte une sauvegarde et réinitialise.'); v.photos.splice(-files.length); }
}

/* =========================================================================
   FICHES TECHNIQUES — référentiel par marque/modèle (couples, RTA, capacités)
   Ces informations sont saisies et maintenues par le garage lui-même à
   partir de ses propres sources professionnelles (RTA, ETAI, documentation
   constructeur). GarageOS ne fournit aucune valeur technique par défaut.
   ========================================================================= */
/* =========================================================================
   SCANNER DE CODES-BARRES — ajout rapide de pièces au catalogue/stock
   Utilise la caméra du téléphone (bibliothèque html5-qrcode). Fonctionne
   sur HTTPS, avec autorisation caméra par le navigateur au premier usage.
   ========================================================================= */
let scannerInstance = null;
let scannerCallback = null;
function openScanner(title, callback){
  if(typeof Html5Qrcode === 'undefined'){ toast("Le module de scan n'a pas pu se charger — vérifie ta connexion internet et réessaie."); return; }
  scannerCallback = callback;
  document.getElementById('scanTitle').textContent = title || 'Scanner un code-barres';
  document.getElementById('scanHint').textContent = 'Cadre le code-barres dans l\'écran.';
  document.getElementById('scanScreen').classList.add('open');
  scannerInstance = new Html5Qrcode('scanReader');
  const config = { fps: 12, qrbox: (w,h)=>({width: Math.min(w*0.85, 320), height: Math.min(h*0.35, 160)}), formatsToSupport: (typeof Html5QrcodeSupportedFormats!=='undefined') ? [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39, Html5QrcodeSupportedFormats.QR_CODE
  ] : undefined };
  scannerInstance.start({ facingMode: 'environment' }, config,
    (decodedText)=>{ onBarcodeDetected(decodedText); },
    ()=>{ /* erreurs de décodage image par image : normal, on ignore */ }
  ).catch(err=>{
    document.getElementById('scanHint').innerHTML = "Impossible d'accéder à la caméra. Vérifie que tu as autorisé l'accès caméra pour ce site, puis réessaie.";
    console.warn('Erreur caméra scanner', err);
  });
}
function onBarcodeDetected(code){
  if(!scannerCallback) return;
  const cb = scannerCallback; scannerCallback = null;
  if(navigator.vibrate) try{ navigator.vibrate(80); }catch(e){}
  closeScanner();
  cb(code);
}
function closeScanner(){
  document.getElementById('scanScreen').classList.remove('open');
  if(scannerInstance){
    scannerInstance.stop().then(()=>scannerInstance.clear()).catch(()=>{});
    scannerInstance = null;
  }
  scannerCallback = null;
}
function scanForCatalogue(){
  openScanner('Scanner une pièce', (code)=>{
    const existing = db.pieces.find(p=>p.codeBarre===code);
    if(existing){
      openQuickStockAdjust(existing.id);
    } else {
      toast('Nouvelle pièce — code-barres pré-rempli.');
      openPieceForm(null, code);
    }
  });

function quickStockDelta(pieceId, delta){

  if(delta<0 && Number(p.stock) <= Number(p.seuil)){
    const fr = findFournisseurByName(p.fournisseur);
    sendAutomation('stock_bas', {designation_piece:p.designation, code_piece:p.ref||'', stock_actuel:String(p.stock), seuil:String(p.seuil), fournisseur_nom:p.fournisseur||'', fournisseur_email: fr?fr.email:''});
  }
}

  ev.preventDefault();

  else { data.id = uid('pce'); db.pieces.push(data); toast('Pièce ajoutée au catalogue.'); }
  if(Number(data.stock) <= Number(data.seuil)){ const fr=findFournisseurByName(data.fournisseur); sendAutomation('stock_bas', {designation_piece:data.designation, code_piece:data.ref||'', stock_actuel:String(data.stock), seuil:String(data.seuil), fournisseur_nom:data.fournisseur||'', fournisseur_email: fr?fr.email:''}); }

function adjustStock(id){
  const p = db.pieces.find(x=>x.id===id);
  const delta = prompt(`Ajuster le stock de "${p.designation}" (actuellement ${p.stock}).\nEntrez une valeur à ajouter (ex: 5 ou -2) :`, '');
  if(delta===null || delta.trim()==='') return;
  const n = parseInt(delta); if(isNaN(n)) return;
  p.stock = Math.max(0, Number(p.stock) + n);
  if(Number(p.stock) <= Number(p.seuil)){ const fr=findFournisseurByName(p.fournisseur); sendAutomation('stock_bas', {designation_piece:p.designation, code_piece:p.ref||'', stock_actuel:String(p.stock), seuil:String(p.seuil), fournisseur_nom:p.fournisseur||'', fournisseur_email: fr?fr.email:''}); }
  saveDB(); render(); toast('Stock mis à jour.');
}

function catalogueIndex(){
  const idx = [];
  db.pieces.forEach(p=>{ const code=(p.ref||'').trim(); if(!code) return; idx.push({code, key:(code+' — '+p.designation), type:'piece', id:p.id, designation:p.designation, pu:p.prixVente, tva: db.settings.tauxTVA}); });
  db.mainOeuvre.forEach(m=>{ const code=(m.code||'').trim(); if(!code) return; idx.push({code, key:(code+' — '+m.designation), type:'mo', id:m.id, designation:m.designation, pu:m.prixHT, tva: m.tva!=null?m.tva:db.settings.tauxTVA}); });
  return idx;
}
function findCatalogueMatch(text){
  const t = (text||'').trim().toLowerCase(); if(!t) return null;
  const idx = catalogueIndex();
  return idx.find(x=>x.key.toLowerCase()===t) || idx.find(x=>x.code.toLowerCase()===t) || null;
}

/* =========================================================================
   SIGNATURE ÉLECTRONIQUE — "bon pour accord" client sur les devis
   ========================================================================= */
let sigCtx = null, sigDrawing = false, sigHasStroke = false, sigLastPos = null;
function initSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr; canvas.height = 150 * dpr;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.strokeStyle = '#15181C'; sigCtx.lineWidth = 2.2; sigCtx.lineCap = 'round'; sigCtx.lineJoin = 'round';
  sigHasStroke = false;
  const getPos = (ev)=>{ const r = canvas.getBoundingClientRect(); const t = ev.touches ? ev.touches[0] : ev; return {x: t.clientX - r.left, y: t.clientY - r.top}; };
  const start = (ev)=>{ ev.preventDefault(); sigDrawing = true; sigLastPos = getPos(ev); };
  const move = (ev)=>{ if(!sigDrawing) return; ev.preventDefault(); const p = getPos(ev); sigCtx.beginPath(); sigCtx.moveTo(sigLastPos.x, sigLastPos.y); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); sigLastPos = p; sigHasStroke = true; };
  const end = ()=>{ sigDrawing = false; };
  canvas.onpointerdown = start; canvas.onpointermove = move; canvas.onpointerup = end; canvas.onpointerleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignaturePad(){
  const canvas = document.getElementById('sigCanvas'); if(!canvas || !sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHasStroke = false;
}
function saveSignature(docType, docId){
  if(!sigHasStroke){ toast('Fais signer avant de valider.'); return; }
  const canvas = document.getElementById('sigCanvas');
  const dataUrl = canvas.toDataURL('image/png');
  const collection = docType==='facture' ? db.factures : db.devis;
  const doc = collection.find(x=>x.id===docId);
  if(!doc){ toast('Enregistre le document avant de signer.'); return; }
  doc.signature = dataUrl; doc.signatureDate = TODAY();
  if(docType==='devis' && doc.statut==='brouillon') doc.statut = 'accepte';
  saveDB(); toast('Signature enregistrée.'); render();
}
function removeSignature(docType, docId){
  if(!confirm('Supprimer la signature ?')) return;
  const collection = docType==='facture' ? db.factures : db.devis;
  const doc = collection.find(x=>x.id===docId);
  if(!doc) return;
  delete doc.signature; delete doc.signatureDate;
  saveDB(); render();
}
function renderSignatureBox(docType, doc){

  if(doc.signature){
    return `<div class="card" style="margin-top:18px;">
      <h4 style="margin-bottom:10px;">Signature client</h4>
      <div class="sig-captured"><img src="${doc.signature}" alt="Signature"></div>
      <p style="font-size:11.5px; color:var(--ink-faint); margin:8px 0 0 0;">Bon pour accord signé le ${fdate(doc.signatureDate)}.</p>
      <button class="btn btn-sm btn-danger" style="margin-top:10px;" onclick="removeSignature('${docType}','${doc.id}')">${icoTrash()} Effacer la signature</button>
    </div>`;
  }
  setTimeout(initSignaturePad, 0);
  return `<div class="card" style="margin-top:18px;">
    <h4 style="margin-bottom:6px;">Signature client — bon pour accord</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0 0 10px 0;">Fais signer directement à l'écran (souris, doigt ou stylet), puis valide.</p>
    <div class="sig-pad-wrap"><canvas id="sigCanvas"></canvas></div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <button type="button" class="btn btn-sm" onclick="clearSignaturePad()">Effacer</button>
      <button type="button" class="btn btn-sm btn-primary" onclick="saveSignature('${docType}','${doc.id}')">Valider la signature</button>
    </div>
  </div>`;
}

function sendRelance(factureId, methode){
  const f = db.factures.find(x=>x.id===factureId); if(!f) return;
  f.relances = f.relances || []; f.relances.push({date: TODAY(), methode}); saveDB();
  const c = getClient(f.clientId);
  if(methode==='email'){
    const total = docTotals(f).ttc; const reste = Math.max(total-(f.montantPaye||0),0);
    const subject = encodeURIComponent(`Relance — Facture ${f.numero}`);
    const body = encodeURIComponent(`Bonjour ${clientLabel(c)},\n\nSauf erreur de notre part, la facture ${f.numero} du ${fdate(f.date)} d'un montant de ${money(reste)} reste à ce jour impayée.\n\nMerci de bien vouloir procéder au règlement dans les meilleurs délais.\n\nCordialement,\n${db.settings.nomGarage}`);
    const mail = c && c.email ? c.email : '';
    window.open(`mailto:${mail}?subject=${subject}&body=${body}`, '_blank');
    toast('Brouillon de relance ouvert dans votre messagerie.');
  } else { toast('Appel de relance noté.'); }
  sendAutomation('relance_envoyee', {numero_facture: f.numero, client: clientLabel(c), client_email: c?.email||'', montant_ttc: docTotals(f).ttc.toFixed(2), reste_du: String(Math.max(docTotals(f).ttc-(f.montantPaye||0),0).toFixed(2)), echeance: f.dateEcheance||'', statut: methode});
  render();
}

function scanForLigne(){
  openScanner('Scanner une pièce à ajouter', (code)=>{
    const p = db.pieces.find(x=>x.codeBarre===code);
    if(!p){
      toast("Code inconnu du catalogue — ajoute d'abord cette pièce dans Catalogue & stock.");
      return;
    }
    const existingLine = editorLignes.find(l=>l.type==='piece' && l.pieceId===p.id);
    if(existingLine){
      existingLine.qte = (Number(existingLine.qte)||0) + 1;
      toast(`${p.designation} : quantité +1.`);
    } else {
      const l = blankLigne();
      l.type = 'piece'; l.pieceId = p.id; l.codeInput = (p.ref?p.ref+' — ':'') + p.designation;
      l.designation = p.designation; l.pu = p.prixVente; l.tva = db.settings.tauxTVA; l.autoDesignation = true;
      // retire une ligne vide non utilisée s'il n'y en a qu'une
      if(editorLignes.length===1 && !editorLignes[0].designation && editorLignes[0].type==='info'){ editorLignes = [l]; }
      else { editorLignes.push(l); }
      toast(`${p.designation} ajouté au document.`);
    }
    renderLignes();
  });
}

function onCodeInput(id, value){
  const l = editorLignes.find(x=>x.id===id); if(!l) return;
  l.codeInput = value;
  const match = findCatalogueMatch(value);

function saveDoc(type){
